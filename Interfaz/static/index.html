<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MUNDIAL · Sistema de gestión</title>
<!--
  Universidad Nacional de La Matanza - Bases de Datos Aplicadas - Comisión 02
  Grupo 7 - Almiron, Luca / Figueroa, Santiago / Ruarte, Fidel / Villalba, Leandro
  Entrega 9 - Interfaz del sistema de gestión del Mundial (estilo retro).
-->
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('tema'); } catch (e) {}
    if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
  :root {
    --paper: #c0c0c0;
    --card: #ffffff;
    --row: #eeeeee;
    --ink: #000000;
    --muted: #444444;
    --navy: #000080;
    --blue: #0000ee;
    --link: #0000ee;
    --line: #808080;
    --soft-line: #b0b0b0;
    --red: #800000;
    --green: #006400;
    --amber: #ffff00;
    --font: "Times New Roman", Times, serif;
  }

  [data-theme="dark"] {
    --paper: #292929;
    --card: #dedede;
    --row: #c9c9c9;
    --ink: #000000;
    --muted: #333333;
    --navy: #000060;
    --blue: #0000cc;
    --link: #0000ee;
    --line: #666666;
    --soft-line: #999999;
    --red: #800000;
    --green: #006400;
    --amber: #ffff00;
  }

  * { box-sizing: border-box; border-radius: 0 !important; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.35 var(--font);
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px dotted #000; outline-offset: 2px; }

  /* Cabecera inspirada en portales y páginas personales de los 90 */
  .panel {
    position: relative;
    z-index: 10;
    color: #fff;
    background: var(--navy);
    border-top: 4px solid #00004d;
    border-bottom: 4px ridge #c0c0c0;
  }
  .panel-in {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    max-width: 1800px;
    margin: 0 auto;
    padding: 12px 18px;
  }
  .logo {
    margin-right: 12px;
    color: #fff;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 25px;
    font-weight: bold;
    letter-spacing: .03em;
    text-shadow: 2px 2px #000;
  }
  .logo small {
    display: block;
    margin-top: 0;
    color: #ffff99;
    font: bold 10px Arial, sans-serif;
    letter-spacing: .12em;
  }
  .botones { display: flex; gap: 5px; flex-wrap: wrap; }
  .tab {
    min-width: 105px;
    padding: 5px 12px;
    border: 2px outset #eeeeee;
    background: #c0c0c0;
    color: #000;
    font: bold 13px Arial, sans-serif;
    text-align: center;
  }
  .tab:hover { background: #e5e5e5; }
  .tab:active, .tab.on {
    border-style: inset;
    background: #d5d5d5;
    color: #000080;
  }
  .tab.vacio { color: #555; }
  .derecha {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-left: auto;
    color: #fff;
    font: 12px Arial, sans-serif;
  }
  .estado::before { content: "●"; margin-right: 5px; color: #c0c0c0; }
  .estado.ok::before { color: #00ff00; }
  .estado.err::before { color: #ff5555; }
  .mini {
    width: 30px;
    height: 27px;
    border: 2px outset #eee;
    background: #c0c0c0;
    color: #000;
    font-weight: bold;
  }
  .mini:active { border-style: inset; }
  .dientes { display: none; }

  .wrap {
    max-width: 1800px;
    margin: 18px auto 35px;
    padding: 0 14px;
  }
  h2.titulo {
    margin: 0 0 4px;
    padding: 7px 10px;
    background: var(--navy);
    color: #fff;
    border: 2px outset #999;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 21px;
  }
  .sub {
    margin: 0 0 15px;
    padding: 7px 3px 9px;
    color: var(--muted);
    border-bottom: 2px groove #999;
  }
  .sub::after { content: none; }
  [data-theme="dark"] .sub, [data-theme="dark"] .estado-msg { color: #d0d0d0; }

  /* Bloque de bienvenida */
  .bienvenida {
    max-width: 760px;
    padding: 18px 20px;
    background: var(--card);
    border: 3px ridge #999;
  }
  .bienvenida h2 {
    margin: 0 0 8px;
    color: var(--navy);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 23px;
  }
  .bienvenida p { margin: 0; color: var(--muted); }

  /* Índice de secciones */
  .tarjetas {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 9px;
  }
  .tarjeta {
    display: flex;
    flex-direction: column;
    min-height: 135px;
    padding: 0;
    background: var(--card);
    border: 2px outset #aaa;
    text-align: left;
  }
  .tarjeta:hover { border-color: #555; }
  .tarjeta:active { border-style: inset; }
  .tarjeta .cab {
    display: flex;
    justify-content: space-between;
    padding: 5px 9px;
    background: var(--navy);
    color: #fff;
    font: bold 12px Arial, sans-serif;
  }
  .tarjeta .cuerpo { padding: 10px 12px 12px; }
  .tarjeta h3 {
    margin: 0 0 5px;
    color: #000080;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 18px;
  }
  .tarjeta p { margin: 0; color: #444; font-size: 14px; }
  .tarjeta .abrir {
    margin-top: 10px;
    color: #0000ee;
    font: bold 12px Arial, sans-serif;
    text-decoration: underline;
  }
  .c0, .c1, .c2 { --c: var(--navy); }

  /* Herramientas y tablas */
  .barra {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 7px;
    margin-bottom: 11px;
  }
  .btn {
    padding: 5px 11px;
    border: 2px outset #eee;
    background: #c0c0c0;
    color: #000;
    font: 13px Arial, sans-serif;
  }
  .btn:hover { background: #dedede; }
  .btn:active { border-style: inset; }
  .btn:disabled { opacity: .45; cursor: default; }
  .campo {
    height: 29px;
    padding: 2px 6px;
    border: 2px inset #ddd;
    background: #fff;
    color: #000;
    font: 14px Arial, sans-serif;
  }
  .campo:focus { outline: 1px dotted #000080; }
  .buscar { flex: 1 1 260px; max-width: 420px; }
  .marco {
    background: var(--card);
    border: 3px ridge #999;
  }
  .scroll { overflow: auto; max-height: calc(100vh - 190px); min-height: 140px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; table-layout: auto; }
  thead th {
    position: sticky;
    top: 0;
    padding: 7px 9px;
    background: #000080;
    color: #fff;
    border: 1px solid #7777aa;
    text-align: left;
    font: bold 12px Arial, sans-serif;
    white-space: normal;
    overflow-wrap: anywhere;
    vertical-align: bottom;
    cursor: pointer;
    user-select: none;
  }
  thead th:hover { background: #0000a0; color: #ffff99; }
  tbody td {
    padding: 5px 8px;
    border: 1px solid #d0d0d0;
    white-space: normal;
    overflow-wrap: anywhere;
    vertical-align: top;
  }
  tbody tr:nth-child(even) td { background: #eeeeee; }
  tbody tr:hover td { background: #ffffcc; }
  td.num, th.num { text-align: right; }
  td.num { white-space: nowrap; }
  td .caja { white-space: nowrap; }
  td.nulo { color: #666; }
  .pie {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 9px;
    padding: 8px 10px;
    background: #c0c0c0;
    border-top: 2px groove #fff;
    color: #000;
    font: 12px Arial, sans-serif;
  }
  .pag { display: flex; align-items: center; gap: 6px; }
  .pag .btn { padding: 3px 8px; }
  .caja {
    display: inline-block;
    padding: 1px 5px;
    border: 1px solid #777;
    background: #eee;
    color: #000;
    font: bold 12px Arial, sans-serif;
  }
  .caja.r { color: #800000; border-color: #800000; }
  .caja.g { color: #006400; border-color: #006400; }
  .caja.b { color: #000080; border-color: #000080; }
  .cuadro {
    display: inline-block;
    width: 9px;
    height: 12px;
    margin-right: 6px;
    vertical-align: -2px;
    border: 1px solid #777;
    background: #ffff00;
  }
  .cuadro.r { background: #cc3333; }
  .gana { color: #006400; font-weight: bold; }
  .estado-msg {
    padding: 38px 18px;
    color: #444;
    text-align: center;
  }
  .error {
    padding: 15px 18px;
    background: #fff;
    border: 3px ridge #999;
    color: #000;
  }
  .error b { color: #800000; }
  .error pre {
    margin: 9px 0 0;
    color: #444;
    font: 12px/1.4 "Courier New", monospace;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* ---------- ABM ---------- */
  .btn.ok, .btn.peligro { font-weight: bold; }
  .btn.ok { color: #006400; }
  .btn.peligro { color: #800000; }
  .btn.chico { padding: 2px 8px; font-size: 12px; }
  td.acc { text-align: right; white-space: nowrap; }
  td.acc .btn + .btn { margin-left: 5px; }
  details.sps {
    margin-bottom: 14px;
    padding: 7px 11px;
    background: var(--card);
    border: 2px groove #999;
    color: #000;
    font: 12px Arial, sans-serif;
  }
  details.sps summary { cursor: pointer; font-weight: bold; color: #000080; }
  details.sps ul { margin: 8px 0 0; padding-left: 18px; }
  details.sps .falta { color: #800000; font-weight: bold; }

  /* Ventanas (estilo cuadro de diálogo de Windows 95) */
  .fondo {
    position: fixed; inset: 0; z-index: 50;
    display: grid; place-items: center; padding: 16px;
    background: rgba(0, 0, 0, .5);
  }
  .modal {
    width: min(520px, 100%);
    max-height: 94vh;
    overflow: auto;
    background: #c0c0c0;
    color: #000;
    border: 3px outset #eee;
    box-shadow: 3px 3px 0 #000;
    font-family: Arial, sans-serif;
  }
  .modal .mcab {
    padding: 4px 8px;
    background: linear-gradient(90deg, #000080, #1084d0);
    color: #fff;
    font: bold 13px Arial, sans-serif;
  }
  .modal .mcuerpo { padding: 4px 16px 16px; font-size: 14px; }
  .modal label, .lbl {
    display: block;
    margin: 12px 0 4px;
    font: bold 13px Arial, sans-serif;
  }
  .modal .campo { width: 100%; }
  .modal textarea.campo { height: auto; min-height: 80px; padding: 6px 8px; resize: vertical; }
  .modal input[type="checkbox"] { width: 16px; height: 16px; }
  .modal label.check { display: flex; align-items: center; gap: 8px; margin-top: 9px; font-weight: normal; }
  .modal .mpie { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
  .aviso {
    margin-top: 12px;
    padding: 8px 10px;
    background: #ffffcc;
    color: #000;
    border: 2px inset #ddd;
    border-left: 6px solid #800000;
    font: 13px Arial, sans-serif;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .aviso:empty { display: none; }
  .aviso.info { border-left-color: #000080; background: #e6e6ff; }
  .aviso.bien { border-left-color: #006400; background: #e3f5e3; }
  .toast {
    position: fixed; right: 18px; bottom: 18px; z-index: 60;
    max-width: 360px;
    padding: 9px 13px;
    background: #ffffe1;
    color: #000;
    border: 2px outset #eee;
    box-shadow: 3px 3px 0 #000;
    font: bold 13px Arial, sans-serif;
  }
  .toast.err { background: #ffe1e1; color: #800000; }

  /* ---------- Importar / Reportes ---------- */
  .form-caja {
    max-width: 640px;
    padding: 6px 18px 18px;
    background: var(--card);
    color: #000;
    border: 3px ridge #999;
  }
  .form-caja .campo { width: 100%; height: auto; min-height: 29px; padding: 5px 7px; }
  .form-caja .acciones { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
  pre.xml {
    margin: 0;
    padding: 10px 12px;
    background: #fff;
    color: #000;
    font: 12px/1.4 "Courier New", monospace;
    white-space: pre;
    overflow: auto;
    max-height: calc(100vh - 380px);
    min-height: 140px;
  }

  /* ---------- Login por rol ---------- */
  #login.fondo { z-index: 70; }
  #login[hidden], .usuario[hidden] { display: none; }
  .login-form .campo { width: 100%; height: auto; min-height: 29px; padding: 5px 7px; }
  .login-form .mpie { margin-top: 16px; }
  .login-form .nota { margin: 10px 0 0; font-size: 12px; opacity: .75; }
  .usuario { display: inline-flex; align-items: center; gap: 8px; }
  .usuario .mini { width: 28px; height: 26px; }

  @media (max-width: 700px) {
    .panel-in { padding: 10px 12px; gap: 9px; }
    .tab { min-width: 0; padding: 5px 9px; }
    .derecha { width: 100%; margin-left: 0; }
    .wrap { margin-top: 12px; padding: 0 10px 30px; }
    .scroll { max-height: none; }
  }
</style>
</head>
<body>
  <header class="panel">
    <div class="panel-in">
      <div class="logo">MUNDIAL<small>SISTEMA DE GESTIÓN</small></div>
      <div class="botones">
        <button class="tab" id="bConsultar">Consultar</button>
        <button class="tab" id="bB">ABM</button>
        <button class="tab" id="bC">Importar</button>
        <button class="tab" id="bD">Reportes</button>
      </div>
      <div class="derecha">
        <span class="usuario" id="usuario" hidden>Usuario: <b id="usuarioRol"></b> <button class="mini" id="cambiarRol" title="Cambiar de usuario" aria-label="Cambiar de usuario">&#8644;</button></span>
        <span class="estado" id="estado">sin consultar</span>
        <button class="mini" id="tema" title="Cambiar entre modo claro y oscuro" aria-label="Cambiar tema"><svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="3"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
      </div>
    </div>
    <div class="dientes"></div>
  </header>

  <main class="wrap" id="contenido"></main>

  <div class="fondo" id="login" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="loginTit">
      <div class="mcab" id="loginTit">Iniciar sesión</div>
      <div class="mcuerpo">
        <form class="login-form" id="loginForm" autocomplete="off">
          <label for="lgUsuario">Usuario</label>
          <input class="campo" id="lgUsuario" type="text" autocomplete="off">
          <label for="lgClave">Contraseña</label>
          <input class="campo" id="lgClave" type="password" autocomplete="off">
          <label for="lgRol">Rol</label>
          <select class="campo" id="lgRol">
            <option>Administrador</option>
            <option>Gestor de publicidad</option>
            <option>Cargador de resultados</option>
            <option>Consulta</option>
          </select>
          <p class="nota">Acceso de demostración: el usuario y la contraseña no se validan.</p>
          <div class="mpie"><button type="submit" class="btn ok" id="lgEntrar">Ingresar</button></div>
        </form>
      </div>
    </div>
  </div>

<script>
(function () {
  'use strict';

  var CAMPOS = [
    { id: 'partidos', titulo: 'Partidos', desc: 'Fixture, sedes y resultados', filtro: 'Fase' },
    { id: 'selecciones', titulo: 'Selecciones', desc: 'Países, grupos y confederaciones', filtro: 'Grupo' },
    { id: 'jugadores', titulo: 'Jugadores', desc: 'Convocados de cada selección', filtro: 'Selección' },
    { id: 'tecnicos', titulo: 'Cuerpo técnico', desc: 'Directores técnicos y ayudantes', filtro: 'Selección' },
    { id: 'sedes', titulo: 'Sedes', desc: 'Estadios, ciudades y capacidad', filtro: 'País' },
    { id: 'arbitros', titulo: 'Árbitros', desc: 'Categoría, idiomas y designaciones', filtro: 'Categoría' },
    { id: 'goles', titulo: 'Goles', desc: 'Autores, minutos y tipos de gol', filtro: 'Tipo' },
    { id: 'tarjetas', titulo: 'Tarjetas', desc: 'Amarillas y rojas por partido', filtro: 'Tarjeta' },
    { id: 'cambios', titulo: 'Cambios', desc: 'Sustituciones de cada partido', filtro: 'Selección' },
    { id: 'publicidad', titulo: 'Publicidad', desc: 'Pauta emitida y costos', filtro: 'Sede' }
  ];
  var POR_ID = {}; CAMPOS.forEach(function (c) { POR_ID[c.id] = c; });

  var $ = function (s) { return document.querySelector(s); };
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function norm(s) { return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
  function nro(n) { return Number(n).toLocaleString('es-AR'); }
  function dinero(n) { return '$ ' + Number(n).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function fecha(s) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s); return m ? m[3] + '/' + m[2] + '/' + m[1] : s; }

  /* tema */
  $('#tema').addEventListener('click', function () {
    var t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('tema', t); } catch (e) {}
  });

  /* datos */
  var cache = {};
  function setEstado(ok) {
    var e = $('#estado'); e.className = 'estado ' + (ok ? 'ok' : 'err');
    e.textContent = ok ? 'conectado a MUNDIAL' : 'sin conexión';
  }
  function cargar(id) {
    if (cache[id]) return Promise.resolve(cache[id]);
    return fetch('/api/datos/' + id).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok || j.error) throw new Error(j.error || ('Error HTTP ' + r.status));
        cache[id] = j; setEstado(true); return j;
      });
    }).catch(function (e) { setEstado(false); throw e; });
  }

  /* ---------- Pantallas ---------- */
  function pantallaInicio() {
    $('#contenido').innerHTML =
      '<div class="bienvenida"><h2>Bienvenido</h2><p>Elegí una opción del panel superior para empezar.</p></div>';
  }

  function pantallaConsultar() {
    $('#contenido').innerHTML =
      '<h2 class="titulo">Consultar</h2><p class="sub">Elegí qué información querés ver.</p>' +
      '<div class="tarjetas">' + CAMPOS.filter(function (c) { return puedeDato(c.id); }).map(function (c, i) {
        return '<button class="tarjeta c' + (i % 3) + '" data-id="' + c.id + '">' +
          '<div class="cab"><span>N° ' + String(i + 1).padStart(2, '0') + '</span><span>★</span></div>' +
          '<div class="cuerpo"><h3>' + esc(c.titulo) + '</h3><p>' + esc(c.desc) + '</p><div class="abrir">ABRIR ►</div></div></button>';
      }).join('') + '</div>';
  }

  /* ---------- Tabla ---------- */
  var T = null;

  function resultado(s) {
    var base = String(s).replace(/ \(.*\)/, ''), pen = /\((.*)\)/.exec(s);
    return '<span class="caja b">' + esc(base) + '</span>' + (pen ? ' <small>' + esc(pen[1]) + '</small>' : '');
  }
  function ganador(row, cols) {
    var s = row[cols.indexOf('Resultado')]; if (!s) return 0;
    var m = /^(\d+) - (\d+)(?: \((\d+)-(\d+) pen\.\))?/.exec(s); if (!m) return 0;
    var a = +m[1], b = +m[2]; if (a === b && m[3] !== undefined) { a = +m[3]; b = +m[4]; }
    return a > b ? 1 : (b > a ? 2 : 0);
  }
  function celda(col, v, row, cols) {
    if (v === null || v === undefined || v === '') return '<td class="nulo">—</td>';
    switch (col) {
      case 'Fecha': case 'Fecha nac.': return '<td>' + esc(fecha(v)) + '</td>';
      case 'Costo final': return '<td class="num">' + dinero(v) + '</td>';
      case 'Resultado': return '<td>' + resultado(v) + '</td>';
      case 'Equipo 1': case 'Equipo 2':
        return '<td class="' + (ganador(row, cols) === (col === 'Equipo 1' ? 1 : 2) ? 'gana' : '') + '">' + esc(v) + '</td>';
      case 'Tarjeta': return '<td><span class="cuadro' + (/^r/i.test(v) ? ' r' : '') + '"></span>' + esc(v) + '</td>';
      case 'Estado': return '<td><span class="caja ' + (/activ|habilit|convoc|titular/i.test(v) ? 'g' : (/lesi|baja|suspend|expuls/i.test(v) ? 'r' : '')) + '">' + esc(v) + '</span></td>';
      case 'Tipo': return '<td><span class="caja ' + (/contra/i.test(v) ? 'r' : (/penal/i.test(v) ? 'b' : 'g')) + '">' + esc(v) + '</span></td>';
      case 'Fase': case 'Grupo': return '<td><span class="caja b">' + esc(v) + '</span></td>';
      case 'Minuto': return '<td class="num">' + esc(v) + '\u2032</td>';
    }
    if (typeof v === 'number') return '<td class="num">' + nro(v) + '</td>';
    return '<td>' + esc(v) + '</td>';
  }

  function filtrar() {
    var q = norm(T.q);
    T.vista = T.rows.filter(function (r) {
      if (T.fcol >= 0 && T.fval && String(r[T.fcol]) !== T.fval) return false;
      return !q || r.some(function (v) { return v !== null && norm(v).indexOf(q) !== -1; });
    });
    if (T.sc >= 0) {
      var c = T.sc, d = T.sd;
      T.vista.sort(function (a, b) {
        var x = a[c], y = b[c]; if (x === null) return 1; if (y === null) return -1;
        return ((typeof x === 'number' && typeof y === 'number') ? x - y : String(x).localeCompare(String(y), 'es', { numeric: true })) * d;
      });
    }
    var tot = Math.max(1, Math.ceil(T.vista.length / T.tam)); if (T.pag > tot) T.pag = tot;
  }
  function pintar() {
    filtrar();
    var cols = T.cols, ini = (T.pag - 1) * T.tam, pag = T.vista.slice(ini, ini + T.tam);
    var esNum = cols.map(function (c, i) {
      var f = T.rows.filter(function (r) { return r[i] !== null; })[0];
      return !!f && typeof f[i] === 'number' && !/^(N°|ID)$/.test(c);
    });
    $('#tabla').innerHTML = '<thead><tr>' + cols.map(function (c, i) {
      return '<th data-i="' + i + '" class="' + (esNum[i] ? 'num' : '') + '">' + esc(c) + (T.sc === i ? (T.sd === 1 ? ' ▲' : ' ▼') : '') + '</th>';
    }).join('') + '</tr></thead><tbody>' + pag.map(function (r) {
      return '<tr>' + r.map(function (v, i) { return celda(cols[i], v, r, cols); }).join('') + '</tr>';
    }).join('') + '</tbody>';
    var n = T.vista.length, tot = Math.max(1, Math.ceil(n / T.tam));
    $('#vacio').style.display = n ? 'none' : 'block';
    $('#info').textContent = n ? 'Registros ' + nro(ini + 1) + '–' + nro(Math.min(ini + T.tam, n)) + ' de ' + nro(n) + (n !== T.rows.length ? ' (filtrado de ' + nro(T.rows.length) + ')' : '') : 'Sin registros';
    $('#pinfo').textContent = 'Pág. ' + T.pag + '/' + tot;
    $('#ant').disabled = T.pag <= 1; $('#sig').disabled = T.pag >= tot;
  }

  function pantallaTabla(c, d) {
    var fc = c.filtro ? d.columns.indexOf(c.filtro) : -1, ops = [];
    if (fc >= 0) {
      var vistos = {}; d.rows.forEach(function (r) { if (r[fc] !== null) vistos[r[fc]] = 1; });
      ops = Object.keys(vistos).sort(function (a, b) { return a.localeCompare(b, 'es', { numeric: true }); });
    }
    T = { cols: d.columns, rows: d.rows, vista: [], q: '', sc: -1, sd: 1, pag: 1, tam: 20, fcol: fc, fval: '' };
    $('#contenido').innerHTML =
      '<h2 class="titulo">' + esc(c.titulo) + '</h2><p class="sub">' + esc(c.desc) + '</p>' +
      '<div class="barra"><button class="btn" id="volver">◄ Volver</button>' +
      '<input class="campo buscar" id="q" type="search" placeholder="Buscar…" autocomplete="off">' +
      (fc >= 0 ? '<select class="campo" id="filtro"><option value="">' + esc(c.filtro) + ': todos</option>' +
        ops.map(function (o) { return '<option value="' + esc(o) + '">' + esc(o) + '</option>'; }).join('') + '</select>' : '') + '</div>' +
      '<div class="marco"><div class="scroll"><table id="tabla"></table>' +
      '<div class="estado-msg" id="vacio" style="display:none">No hay registros que coincidan.</div></div>' +
      '<div class="pie"><span id="info"></span><div class="pag">' +
      '<select class="campo" id="tam" style="height:32px"><option>10</option><option selected>20</option><option>50</option><option>100</option></select>' +
      '<button class="btn" id="ant">◄</button><span id="pinfo"></span><button class="btn" id="sig">►</button></div></div></div>';
    var t;
    $('#volver').addEventListener('click', function () { location.hash = 'consultar'; });
    $('#q').addEventListener('input', function (e) { clearTimeout(t); t = setTimeout(function () { T.q = e.target.value; T.pag = 1; pintar(); }, 120); });
    if (fc >= 0) $('#filtro').addEventListener('change', function (e) { T.fval = e.target.value; T.pag = 1; pintar(); });
    $('#tam').addEventListener('change', function (e) { T.tam = +e.target.value; T.pag = 1; pintar(); });
    $('#ant').addEventListener('click', function () { T.pag--; pintar(); });
    $('#sig').addEventListener('click', function () { T.pag++; pintar(); });
    $('#tabla').addEventListener('click', function (e) {
      var th = e.target.closest('th'); if (!th) return; var i = +th.dataset.i;
      if (T.sc === i) T.sd *= -1; else { T.sc = i; T.sd = 1; } pintar();
    });
    pintar();
  }

  /* ---------- ABM ---------- */
  function api(url, opts) {
    return fetch(url, opts).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok || j.error) throw new Error(j.error || ('Error HTTP ' + r.status));
        return j;
      });
    });
  }
  var toastT;
  function aviso(msg, err) {
    var t = document.querySelector('.toast'); if (t) t.remove();
    t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg;
    document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(function () { t.remove(); }, 3800);
  }
  function errorPantalla(e, volver) {
    $('#contenido').innerHTML = '<div class="error"><b>No se pudieron cargar los datos.</b><pre>' + esc(e.message) + '</pre>' +
      '<p><button class="btn" id="volver">◄ Volver</button></p></div>';
    $('#volver').addEventListener('click', function () { location.hash = volver; });
  }

  function pantallaABM() {
    $('#contenido').innerHTML = '<div class="estado-msg">Cargando…</div>';
    api('/api/abm').then(function (lista) {
      lista = lista.filter(function (c) { return puedeEntidad(c.id); });
      $('#contenido').innerHTML =
        '<h2 class="titulo">ABM</h2><p class="sub">Altas, bajas y modificaciones (a través de stored procedures).</p>' +
        '<div class="tarjetas">' + lista.map(function (c, i) {
          return '<button class="tarjeta c' + (i % 3) + '" data-abm="' + esc(c.id) + '">' +
            '<div class="cab"><span>N° ' + String(i + 1).padStart(2, '0') + '</span><span>★</span></div>' +
            '<div class="cuerpo"><h3>' + esc(c.titulo) + '</h3><p>' + esc(c.desc) + '</p><div class="abrir">ABRIR ►</div></div></button>';
        }).join('') + '</div>';
    }, function (e) { errorPantalla(e, ''); });
  }

  var AB = null;
  function etiquetaFila(f) { var c = AB.m.campos; return f[c[0].clave] + (c[1] ? ' · ' + f[c[1].clave] : ''); }
  function pkDeFila(fila) {
    var p = AB && AB.m ? AB.m.pk : null;
    if (!p) return '';
    return (Array.isArray(p) ? p : [p]).map(function (c) { return fila[c]; }).join('~');
  }

  function cargarABM(id) {
    return api('/api/abm/' + id).then(function (m) { AB = { id: id, m: m, q: '', pag: 1, tam: 50 }; indexarABM(m); setEstado(true); return m; });
  }

  function pantallaABMTabla(id) {
    $('#contenido').innerHTML = '<div class="estado-msg">Cargando…</div>';
    cargarABM(id).then(function (m) {
      var roles = [['alta', 'Alta'], ['modificacion', 'Modificación'], ['baja', 'Baja']];
      var sps = '<details class="sps"><summary>Procedimientos almacenados usados</summary><ul>' + roles.map(function (r) {
        var lst = m.sps[r[0]] ? [].concat(m.sps[r[0]]) : [];
        return '<li>' + r[1] + ': ' + (lst.length ? lst.map(function (sp) {
          return '<b>' + esc(sp.nombre) + '</b> (' + esc(sp.params.join(', ')) + ')';
        }).join(' + ') : '<span class="falta">no encontrado</span>') + '</li>';
      }).join('') + '</ul>' + (m.todos.length ? '<div style="margin-top:6px">Con "' + esc(m.etiqueta) + '" en el nombre: ' + esc(m.todos.join(', ')) + '</div>' : '') + '</details>';
      $('#contenido').innerHTML =
        '<h2 class="titulo">ABM · ' + esc(m.titulo) + '</h2><p class="sub">Todas las operaciones pasan por los stored procedures.</p>' + sps +
        '<div class="barra"><button class="btn" id="volver">◄ Volver</button>' +
        '<button class="btn ok" id="nuevo"' + (m.sps.alta ? '' : ' disabled title="No se encontró el SP de alta"') + '>+ Nueva ' + esc(m.etiqueta) + '</button>' +
        '<input class="campo buscar" id="q" type="search" placeholder="Buscar…" autocomplete="off"></div>' +
        '<div class="marco"><div class="scroll"><table id="tabla"></table>' +
        '<div class="estado-msg" id="vacio" style="display:none">No hay registros.</div></div>' +
        '<div class="pie"><span id="info"></span><div class="pag">' +
        '<select class="campo" id="tam" style="height:32px"><option>10</option><option>20</option><option selected>50</option><option>100</option></select>' +
        '<button class="btn" id="ant">◄</button><span id="pinfo"></span><button class="btn" id="sig">►</button></div></div></div>';
      $('#volver').addEventListener('click', function () { location.hash = 'abm'; });
      $('#nuevo').addEventListener('click', function () { formularioABM(null); });
      var t;
      $('#q').addEventListener('input', function (e) { clearTimeout(t); t = setTimeout(function () { AB.q = e.target.value; AB.pag = 1; filasABM(); }, 120); });
      $('#tam').addEventListener('change', function (e) { AB.tam = +e.target.value; AB.pag = 1; filasABM(); });
      $('#ant').addEventListener('click', function () { AB.pag--; filasABM(); });
      $('#sig').addEventListener('click', function () { AB.pag++; filasABM(); });
      $('#tabla').addEventListener('click', function (e) {
        var b = e.target.closest('button[data-acc]'); if (!b) return;
        var f = AB.m.filas.filter(function (x) { return pkDeFila(x) === b.dataset.id; })[0];
        if (!f) return;
        if (b.dataset.acc === 'edit') formularioABM(f); else if (b.dataset.acc === 'tanda') tandaPenales(f); else confirmarBaja(f);
      });
      filasABM();
    }).catch(function (e) { errorPantalla(e, 'abm'); });
  }

  function indexarABM(m) {   /* texto normalizado de cada fila, calculado una sola vez */
    m.idx = m.filas.map(function (f) {
      return norm(m.columnas.map(function (c) { var v = f[c.clave]; return v === null || v === undefined ? '' : v; }).join(' | '));
    });
  }

  function filasABM() {
    var m = AB.m, q = norm(AB.q), vista = [];
    for (var i = 0; i < m.filas.length; i++) if (!q || m.idx[i].indexOf(q) !== -1) vista.push(m.filas[i]);
    var tot = Math.max(1, Math.ceil(vista.length / AB.tam));
    if (AB.pag > tot) AB.pag = tot; if (AB.pag < 1) AB.pag = 1;
    var ini = (AB.pag - 1) * AB.tam, pag = vista.slice(ini, ini + AB.tam);
    $('#tabla').innerHTML = '<thead><tr>' + m.columnas.map(function (c) { return '<th>' + esc(c.titulo) + '</th>'; }).join('') + '<th></th></tr></thead><tbody>' +
      pag.map(function (f) {
        return '<tr>' + m.columnas.map(function (c) {
          var v = f[c.clave];
          if (v === null || v === undefined) return '<td class="nulo">—</td>';
          return typeof v === 'number' ? '<td class="num">' + nro(v) + '</td>' : '<td>' + esc(v) + '</td>';
        }).join('') + '<td class="acc">' +
          (AB.id === 'partidos' ? '<button class="btn chico" data-acc="tanda" data-id="' + esc(pkDeFila(f)) + '">Penales</button>' : '') +
          '<button class="btn chico" data-acc="edit" data-id="' + esc(pkDeFila(f)) + '"' + (m.sps.modificacion ? '' : ' disabled') + '>Editar</button>' +
          ((getRol() && PERMISOS[getRol()].baja) ? '<button class="btn chico peligro" data-acc="del" data-id="' + esc(pkDeFila(f)) + '"' + (m.sps.baja ? '' : ' disabled') + '>Eliminar</button>' : '') + '</td></tr>';
      }).join('') + '</tbody>';
    var n = vista.length;
    $('#vacio').style.display = n ? 'none' : 'block';
    $('#info').textContent = n ? 'Registros ' + nro(ini + 1) + '–' + nro(Math.min(ini + AB.tam, n)) + ' de ' + nro(n) +
      (n !== m.filas.length ? ' (filtrado de ' + nro(m.filas.length) + ')' : '') : 'Sin registros';
    $('#pinfo').textContent = 'Pág. ' + AB.pag + '/' + tot;
    $('#ant').disabled = AB.pag <= 1; $('#sig').disabled = AB.pag >= tot;
  }

  /* modales */
  function abrirModal(titulo, cuerpo) {
    cerrarModal();
    var f = document.createElement('div'); f.className = 'fondo'; f.id = 'modal';
    f.innerHTML = '<div class="modal" role="dialog" aria-modal="true"><div class="mcab">' + esc(titulo) + '</div><div class="mcuerpo">' + cuerpo + '</div></div>';
    f.addEventListener('mousedown', function (e) { if (e.target === f) cerrarModal(); });
    document.body.appendChild(f);
    return f;
  }
  function cerrarModal() { var f = $('#modal'); if (f) f.remove(); }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') cerrarModal(); });

  function formularioABM(fila) {
    var m = AB.m, nuevo = !fila;
    var visibles = m.campos.filter(function (c) { return nuevo ? !c.solo_edicion : !c.solo_alta; });
    function valor(v) { return v === null || v === undefined ? '' : v; }
    function marcado(v) { return v === 1 || v === true || v === '1' || v === 'true'; }
    var campos = visibles.map(function (c) {
      var v = fila ? valor(fila[c.clave]) : '', id = 'f_' + c.clave, html;
      var req = c.obligatorio ? ' required' : '';
      if (c.tipo === 'lista' || c.tipo === 'lista_texto') {
        html = '<select class="campo" id="' + id + '"' + req + '><option value="">— elegir —</option>' + (m.opciones[c.opciones] || []).map(function (o) {
          return '<option value="' + esc(o.id) + '"' + (String(o.id) === String(v) ? ' selected' : '') + '>' + esc(o.nombre) + '</option>';
        }).join('') + '</select>';
      } else if (c.tipo === 'numero' || c.tipo === 'decimal') {
        html = '<input class="campo" id="' + id + '" type="number"' + (c.tipo === 'decimal' ? ' step="0.01"' : ' step="1"') +
          (c.min !== undefined ? ' min="' + c.min + '"' : '') + (c.max !== undefined ? ' max="' + c.max + '"' : '') +
          req + ' value="' + esc(v) + '">';
      } else if (c.tipo === 'fecha') {
        html = '<input class="campo" id="' + id + '" type="date"' + req + ' value="' + esc(v) + '">';
      } else if (c.tipo === 'hora') {
        html = '<input class="campo" id="' + id + '" type="time"' + req + ' value="' + esc(v) + '">';
      } else if (c.tipo === 'booleano') {
        html = '<label class="check"><input type="checkbox" id="' + id + '"' + (marcado(v) ? ' checked' : '') + '> Sí</label>';
      } else if (c.tipo === 'texto_largo') {
        html = '<textarea class="campo" id="' + id + '" rows="3"' + (c.max ? ' maxlength="' + c.max + '"' : '') + req + '>' + esc(v) + '</textarea>';
      } else {
        html = '<input class="campo" id="' + id + '" type="text" autocomplete="off"' + (c.max ? ' maxlength="' + c.max + '"' : '') + req + ' value="' + esc(v) + '">';
      }
      return '<label for="' + id + '">' + esc(c.etiqueta) + (c.obligatorio ? ' *' : '') + '</label>' + html;
    }).join('');
    var f = abrirModal((nuevo ? 'Nueva ' : 'Modificar ') + m.etiqueta,
      '<form id="form">' + campos + '<div class="aviso" id="err" role="alert"></div>' +
      '<div class="mpie"><button type="button" class="btn" id="cancelar">Cancelar</button><button type="submit" class="btn ok" id="guardar">Guardar</button></div></form>');
    if (!nuevo) m.pk.forEach(function (k) { var el = $('#f_' + k); if (el) el.disabled = true; });   /* la clave no se edita */
    var primero = f.querySelector('input:not([disabled]),select:not([disabled]),textarea'); if (primero) primero.focus();
    $('#cancelar').addEventListener('click', cerrarModal);
    $('#form').addEventListener('submit', function (e) {
      e.preventDefault();
      var datos = {};
      visibles.forEach(function (c) {
        var el = $('#f_' + c.clave);
        datos[c.clave] = c.tipo === 'booleano' ? (el.checked ? '1' : '0') : el.value;
      });
      $('#err').textContent = ''; $('#guardar').disabled = true;
      api('/api/abm/' + AB.id + (nuevo ? '' : '/' + encodeURIComponent(pkDeFila(fila))), {
        method: nuevo ? 'POST' : 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(datos)
      }).then(function (r) {
        cerrarModal(); aviso(nuevo ? 'Alta realizada correctamente.' : 'Modificación guardada.');
        return recargarABM();
      }, function (e2) { $('#err').textContent = e2.message; $('#guardar').disabled = false; });
    });
  }

  function tandaPenales(fila) {
    abrirModal('Tanda de penales',
      '<p>Partido N° <b>' + esc(fila.IdPartido) + '</b>: ' + esc(fila.Equipo1) + ' vs ' + esc(fila.Equipo2) + '</p>' +
      '<p>Ejecuta <code>SP.uspPartido_Tanda</code>. Elegí la acción:</p>' +
      '<div class="aviso" id="err" role="alert"></div>' +
      '<div class="mpie"><button class="btn" id="cancelar">Cancelar</button>' +
      '<button class="btn" id="t0">Finalizar tanda (@Iniciar = 0)</button>' +
      '<button class="btn ok" id="t1">Iniciar tanda (@Iniciar = 1)</button></div>');
    $('#cancelar').addEventListener('click', cerrarModal);
    function ir(iniciar) {
      $('#err').textContent = ''; $('#t0').disabled = $('#t1').disabled = true;
      api('/api/abm/partidos/' + encodeURIComponent(pkDeFila(fila)) + '/tanda', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ iniciar: iniciar })
      }).then(function () { cerrarModal(); aviso('Tanda de penales actualizada.'); return recargarABM(); },
        function (e) { $('#err').textContent = e.message; $('#t0').disabled = $('#t1').disabled = false; });
    }
    $('#t0').addEventListener('click', function () { ir(false); });
    $('#t1').addEventListener('click', function () { ir(true); });
  }

  function confirmarBaja(fila) {
    var m = AB.m;
    abrirModal('Eliminar ' + m.etiqueta,
      '<p>¿Seguro que querés eliminar la ' + esc(m.etiqueta) + ' <b>' + esc(etiquetaFila(fila)) + '</b>?<br>Esta acción no se puede deshacer.</p>' +
      '<div class="aviso" id="err" role="alert"></div>' +
      '<div class="mpie"><button class="btn" id="cancelar">Cancelar</button><button class="btn peligro" id="confirmar">Eliminar</button></div>');
    $('#cancelar').focus();
    $('#cancelar').addEventListener('click', cerrarModal);
    $('#confirmar').addEventListener('click', function () {
      $('#err').textContent = ''; $('#confirmar').disabled = true;
      api('/api/abm/' + AB.id + '/' + encodeURIComponent(pkDeFila(fila)), { method: 'DELETE' }).then(function () {
        cerrarModal(); aviso('Registro eliminado.'); return recargarABM();
      }, function (e) { $('#err').textContent = e.message; $('#confirmar').disabled = false; });
    });
  }

  function recargarABM() {
    var q = AB.q, id = AB.id;
    return api('/api/abm/' + id).then(function (m) { indexarABM(m); AB.m = m; AB.q = q; filasABM(); },
      function (e) { aviso(e.message, true); });
  }

  /* ---------- Importar (Entrega 6) y Reportes (Entrega 7) ---------- */
  function tablaHTML(cols, filas) {
    return '<div class="scroll"><table><thead><tr>' + cols.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') +
      '</tr></thead><tbody>' + filas.map(function (r) {
        return '<tr>' + r.map(function (v) {
          if (v === null || v === undefined) return '<td class="nulo">—</td>';
          return typeof v === 'number' ? '<td class="num">' + esc(v) + '</td>' : '<td>' + esc(v) + '</td>';
        }).join('') + '</tr>';
      }).join('') + '</tbody></table></div>';
  }
  function conjuntosHTML(r) {
    var h = '';
    (r.mensajes || []).forEach(function (m) { h += '<div class="aviso info">' + esc(m) + '</div>'; });
    (r.conjuntos || []).forEach(function (c) {
      h += '<div class="marco" style="margin-top:16px">' + tablaHTML(c.columnas, c.filas) +
        '<div class="pie"><span>' + c.total + ' fila(s)' + (c.total > c.filas.length ? ' — se muestran las primeras ' + c.filas.length : '') + '</span></div></div>';
    });
    return h;
  }
  function tarjetasHTML(lista, attr) {
    return '<div class="tarjetas">' + lista.map(function (c, i) {
      return '<button class="tarjeta c' + (i % 3) + '" ' + attr + '="' + esc(c.id) + '"' + (c.disponible === false ? ' title="Falta el script .sql en la carpeta de importadores"' : '') + '>' +
        '<div class="cab"><span>N° ' + String(i + 1).padStart(2, '0') + '</span><span>★</span></div>' +
        '<div class="cuerpo"><h3>' + esc(c.titulo) + '</h3><p>' + esc(c.desc) + '</p><div class="abrir">ABRIR ►</div></div></button>';
    }).join('') + '</div>';
  }
  function bonito(xml) {
    var nivel = 0;
    return xml.replace(/>\s*</g, '>\n<').split('\n').map(function (l) {
      if (/^<\//.test(l)) nivel = Math.max(nivel - 1, 0);
      var linea = new Array(nivel + 1).join('  ') + l;
      if (/^<[^!?\/][^>]*>$/.test(l) && !/\/>$/.test(l)) nivel++;
      return linea;
    }).join('\n');
  }

  function pantallaImportar() {
    $('#contenido').innerHTML = '<div class="estado-msg">Cargando…</div>';
    api('/api/importar').then(function (lista) {
      $('#contenido').innerHTML = '<h2 class="titulo">Importar</h2><p class="sub">Ejecutá los scripts de importación de la Entrega 6 en orden. Si no elegís archivos se usan los de la carpeta Datos del proyecto.</p>' + tarjetasHTML(lista, 'data-imp');
    }).catch(function (e) { errorPantalla(e, 'importar'); });
  }

  function pantallaImportarForm(id) {
    $('#contenido').innerHTML = '<div class="estado-msg">Cargando…</div>';
    api('/api/importar').then(function (lista) {
      var c = lista.filter(function (x) { return x.id === id; })[0];
      if (!c) throw new Error('Importación desconocida: ' + id);
      $('#contenido').innerHTML = '<h2 class="titulo">Importar · ' + esc(c.titulo) + '</h2><p class="sub">' + esc(c.desc) + '.</p>' +
        '<div class="barra"><button class="btn" id="volver">◄ Volver</button></div>' +
        '<div class="form-caja">' + (c.archivos.length
          ? '<p class="sub">Archivos opcionales: si no elegís ninguno se usan los de la carpeta <b>Datos</b> del proyecto.</p>' + c.archivos.map(function (a) {
              return '<label class="lbl" for="a_' + a.variable + '">' + esc(a.etiqueta) + '</label>' +
                '<input class="campo" type="file" id="a_' + a.variable + '" accept="' + esc(a.ext.join(',')) + '">';
            }).join('')
          : '<p class="sub">Esta importación usa los archivos de la carpeta <b>Datos</b> del proyecto.</p>') +
          (c.disponible ? '' : '<div class="aviso">No encuentro el script <b>' + esc(c.script) + '</b>. Copialo a la carpeta <b>' + esc(c.carpeta) + '</b> y volvé a abrir esta pantalla.</div>') +
          '<div class="acciones"><button class="btn ok" id="importar">Importar</button></div></div>' +
        '<div id="resultado"></div>';
      $('#volver').addEventListener('click', function () { location.hash = 'importar'; });
      $('#importar').addEventListener('click', function () {
        var fd = new FormData();
        c.archivos.forEach(function (a) {
          var f = $('#a_' + a.variable).files[0];
          if (f) fd.append(a.variable, f);
        });
        var btn = $('#importar'); btn.disabled = true;
        $('#resultado').innerHTML = '<div class="estado-msg">Importando…</div>';
        api('/api/importar/' + id, { method: 'POST', body: fd }).then(function (r) {
          var cab = r.fallo ? '<div class="aviso">' + esc(r.aviso) + '</div>'
            : (r.aviso ? '<div class="aviso">' + esc(r.aviso) + '</div>' : '<div class="aviso bien">Importación finalizada.</div>');
          $('#resultado').innerHTML = '<div style="margin-top:18px">' + cab + conjuntosHTML(r) + '</div>';
          setEstado(true);
        }, function (e) { $('#resultado').innerHTML = '<div class="aviso">' + esc(e.message) + '</div>'; })
          .then(function () { btn.disabled = false; });
      });
    }).catch(function (e) { errorPantalla(e, 'importar'); });
  }

  var RP = null;
  function cargarReportes() { return RP ? Promise.resolve(RP) : api('/api/reportes').then(function (r) { RP = r; return r; }); }

  function pantallaReportes() {
    $('#contenido').innerHTML = '<div class="estado-msg">Cargando…</div>';
    cargarReportes().then(function (d) {
      $('#contenido').innerHTML = '<h2 class="titulo">Reportes</h2><p class="sub">Reportes de la Entrega 7, ejecutados con sus stored procedures.</p>' + tarjetasHTML(d.reportes.filter(function (r) { return puedeReporte(r.id); }), 'data-rep');
    }).catch(function (e) { errorPantalla(e, 'reportes'); });
  }

  function pantallaReporteForm(id) {
    $('#contenido').innerHTML = '<div class="estado-msg">Cargando…</div>';
    cargarReportes().then(function (d) {
      var c = d.reportes.filter(function (x) { return x.id === id && puedeReporte(x.id); })[0];
      if (!c) throw new Error('Reporte desconocido: ' + id);
      var extra = Object.keys(c.extra || {}).map(function (k) {
        return '<label class="lbl" for="r_' + k + '">' + esc(k) + '</label><select class="campo" id="r_' + k + '">' +
          c.extra[k].map(function (v) { return '<option>' + esc(v) + '</option>'; }).join('') + '</select>';
      }).join('');
      var campos = (c.campos || []).map(function (f) {
        var id = 'r_' + f.nombre, lbl = '<label class="lbl" for="' + id + '">' + esc(f.etiqueta) + '</label>';
        if (f.tipo === 'lista') {
          return lbl + '<select class="campo" id="' + id + '" required><option value="">— elegir —</option>' +
            ((d.opciones || {})[f.opciones] || []).map(function (o) { return '<option value="' + esc(o.id) + '">' + esc(o.nombre) + '</option>'; }).join('') + '</select>';
        }
        return lbl + '<input class="campo" id="' + id + '" type="number" step="1" min="0" required>';
      }).join('');
      var selMundial = c.sin_mundial ? '' : '<label class="lbl" for="r_mundial">Mundial</label><select class="campo" id="r_mundial">' +
        d.mundiales.map(function (m) { return '<option value="' + esc(m.id) + '">' + esc(m.nombre) + '</option>'; }).join('') + '</select>';
      $('#contenido').innerHTML = '<h2 class="titulo">Reporte · ' + esc(c.titulo) + '</h2><p class="sub">' + esc(c.desc) + '</p>' +
        '<div class="barra"><button class="btn" id="volver">◄ Volver</button></div>' +
        '<div class="form-caja">' + selMundial + extra + campos +
        '<div class="acciones"><button class="btn ok" id="generar">Generar</button></div></div><div id="resultado"></div>';
      $('#volver').addEventListener('click', function () { location.hash = 'reportes'; });
      $('#generar').addEventListener('click', function () {
        var cuerpo = c.sin_mundial ? {} : { mundial: $('#r_mundial').value };
        Object.keys(c.extra || {}).forEach(function (k) { cuerpo[k] = $('#r_' + k).value; });
        (c.campos || []).forEach(function (f) { cuerpo[f.nombre] = $('#r_' + f.nombre).value; });
        var btn = $('#generar'); btn.disabled = true;
        $('#resultado').innerHTML = '<div class="estado-msg">Generando…</div>';
        api('/api/reportes/' + id, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cuerpo) }).then(function (r) {
          var h = '<div style="margin-top:18px">';
          if (r.xml) {
            var xml = bonito(r.xml);
            h += (r.mensajes || []).map(function (m) { return '<div class="aviso info">' + esc(m) + '</div>'; }).join('') +
              '<div class="marco" style="margin-top:16px"><pre class="xml" id="xml"></pre><div class="pie"><span>XML · ' + r.xml.length + ' caracteres</span>' +
              '<button class="btn ok" id="bajar">Descargar XML</button></div></div></div>';
            $('#resultado').innerHTML = h;
            $('#xml').textContent = xml;
            $('#bajar').addEventListener('click', function () {
              var blob = new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n' + xml], { type: 'application/xml' });
              var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
              a.download = 'reporte_' + id + (cuerpo.mundial ? '_mundial' + cuerpo.mundial : '') + '.xml';
              document.body.appendChild(a); a.click(); a.remove();
              setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
            });
          } else {
            h += conjuntosHTML(r);
            if (!(r.conjuntos || []).length && !(r.mensajes || []).length) h += '<div class="aviso info">El reporte no devolvió filas.</div>';
            $('#resultado').innerHTML = h + '</div>';
          }
          setEstado(true);
        }, function (e) { $('#resultado').innerHTML = '<div class="aviso">' + esc(e.message) + '</div>'; })
          .then(function () { btn.disabled = false; });
      });
    }).catch(function (e) { errorPantalla(e, 'reportes'); });
  }

  /* ---------- Rutas: #consultar, #consultar/partidos, #abm, #abm/sedes ---------- */
  function ruta() {
    var partes = (location.hash || '').replace('#', '').split('/');
    if (!getRol()) return;                                   /* sin rol: se muestra el login */
    if (['abm', 'importar', 'reportes'].indexOf(partes[0]) >= 0 && !tienePermiso(partes[0])) { location.hash = 'consultar'; return; }
    if (partes[0] === 'abm' && partes[1] && !puedeEntidad(partes[1])) { location.hash = 'abm'; return; }
    if (partes[0] === 'consultar' && partes[1] && POR_ID[partes[1]] && !puedeDato(partes[1])) { location.hash = 'consultar'; return; }
    if (partes[0] === 'reportes' && partes[1] && !puedeReporte(partes[1])) { location.hash = 'reportes'; return; }
    $('#bConsultar').classList.toggle('on', partes[0] === 'consultar');
    $('#bB').classList.toggle('on', partes[0] === 'abm');
    $('#bC').classList.toggle('on', partes[0] === 'importar');
    $('#bD').classList.toggle('on', partes[0] === 'reportes');
    cerrarModal(); window.scrollTo(0, 0);
    if (partes[0] === 'abm') return partes[1] ? pantallaABMTabla(partes[1]) : pantallaABM();
    if (partes[0] === 'importar') return partes[1] ? pantallaImportarForm(partes[1]) : pantallaImportar();
    if (partes[0] === 'reportes') return partes[1] ? pantallaReporteForm(partes[1]) : pantallaReportes();
    if (partes[0] !== 'consultar') return pantallaInicio();
    var c = POR_ID[partes[1]];
    if (!c) return pantallaConsultar();
    $('#contenido').innerHTML = '<div class="estado-msg">Cargando…</div>';
    cargar(c.id).then(function (d) {
      if (location.hash === '#consultar/' + c.id) pantallaTabla(c, d);
    }, function (e) {
      $('#contenido').innerHTML = '<div class="error"><b>No se pudieron cargar los datos.</b><div>Revisá la conexión a SQL Server y los nombres de columnas.</div><pre>' + esc(e.message) + '</pre>' +
        '<p><button class="btn" id="volver">◄ Volver</button></p></div>';
      $('#volver').addEventListener('click', function () { location.hash = 'consultar'; });
    });
  }
  $('#bConsultar').addEventListener('click', function () { location.hash = 'consultar'; });
  $('#bB').addEventListener('click', function () { location.hash = 'abm'; });
  $('#bC').addEventListener('click', function () { location.hash = 'importar'; });
  $('#bD').addEventListener('click', function () { location.hash = 'reportes'; });
  $('#contenido').addEventListener('click', function (e) {
    var t = e.target.closest('.tarjeta'); if (!t) return;
    if (t.dataset.abm) location.hash = 'abm/' + t.dataset.abm;
    else if (t.dataset.imp) location.hash = 'importar/' + t.dataset.imp;
    else if (t.dataset.rep) location.hash = 'reportes/' + t.dataset.rep;
    else if (t.dataset.id) location.hash = 'consultar/' + t.dataset.id;
  });
  window.addEventListener('hashchange', ruta);

  /* ---------- Roles ---------- */
  // Administrador: todo (incluye Importar y baja).
  // Gestor de publicidad: ABM de anunciantes, campañas, piezas y espacios (sin baja); consulta solo Publicidad y Sedes;
  //   de los reportes solo "Ocupación publicitaria".
  // Cargador de resultados: ABM de partidos (con penales), goles, eventos, tarjetas, sustituciones, alineaciones y arbitrajes
  //   (sin baja, sin Importar); consulta los datos deportivos (sin Publicidad); sin reportes.
  // Consulta: consultar + reportes, sin ABM.
  // El backend (app.py, ROL_PERMISOS) valida lo mismo en cada /api/*; esto solo adapta la interfaz.
  var PUBLICIDAD = ['anunciantes', 'campanias', 'publicidades', 'espacios'];
  var RESULTADOS = ['partidos', 'goles', 'eventos', 'amonestaciones', 'sustituciones', 'alineaciones', 'arbitrajes'];
  var SIN_PUBLICIDAD = CAMPOS.map(function (c) { return c.id; }).filter(function (id) { return id !== 'publicidad'; });
  // abmEntidades / datos / reportesIds: null = todos; baja: puede eliminar
  var PERMISOS = {
    'Administrador':          { abm: true,  importar: true,  reportes: true,  abmEntidades: null,      baja: true,  datos: null,                    reportesIds: null },
    'Gestor de publicidad':   { abm: true,  importar: false, reportes: true,  abmEntidades: PUBLICIDAD, baja: false, datos: ['publicidad', 'sedes'], reportesIds: ['publicidad'] },
    'Cargador de resultados': { abm: true,  importar: false, reportes: false, abmEntidades: RESULTADOS, baja: false, datos: SIN_PUBLICIDAD,         reportesIds: [] },
    'Consulta':               { abm: false, importar: false, reportes: true,  abmEntidades: [],         baja: false, datos: null,                    reportesIds: null }
  };
  var ROLES = Object.keys(PERMISOS);
  var rolMem = null;
  function getRol() {
    if (!rolMem) { try { rolMem = sessionStorage.getItem('rol'); } catch (e) {} }
    return ROLES.indexOf(rolMem) >= 0 ? rolMem : null;
  }
  function tienePermiso(p) { var r = getRol(); return !!(r && PERMISOS[r][p]); }
  function enLista(lst, id) { return lst === null || lst.indexOf(id) >= 0; }
  function puedeDato(id) { var r = getRol(); return !!r && enLista(PERMISOS[r].datos, id); }
  function puedeReporte(id) { var r = getRol(); return !!r && PERMISOS[r].reportes && enLista(PERMISOS[r].reportesIds, id); }
  function puedeEntidad(id) { var r = getRol(); if (!r || !PERMISOS[r].abm) return false; var e = PERMISOS[r].abmEntidades; return e === null || e.indexOf(id) >= 0; }

  // todos los pedidos llevan el rol en el header X-Rol
  var fetchOriginal = window.fetch.bind(window);
  window.fetch = function (url, opts) {
    opts = opts || {};
    var h = new Headers(opts.headers || {});
    if (getRol()) h.set('X-Rol', getRol());
    opts.headers = h;
    return fetchOriginal(url, opts);
  };

  var usuarioMem = '';
  function getUsuario() {
    if (!usuarioMem) { try { usuarioMem = sessionStorage.getItem('usuario') || ''; } catch (e) {} }
    return usuarioMem;
  }
  function setRol(r, usuario) {
    rolMem = r; usuarioMem = r ? (usuario || '') : '';
    try {
      if (r) { sessionStorage.setItem('rol', r); sessionStorage.setItem('usuario', usuarioMem); }
      else { sessionStorage.removeItem('rol'); sessionStorage.removeItem('usuario'); }
    } catch (e) {}
    cache = {}; RP = null; AB = null;      /* lo cargado con otro rol no se reutiliza */
    pintarSesion();
    ruta();
  }
  function pintarSesion() {
    var r = getRol();
    $('#login').hidden = !!r; $('#usuario').hidden = !r;
    $('#usuarioRol').textContent = r ? (getUsuario() ? getUsuario() + ' · ' + r : r) : '';
    $('#bB').style.display = tienePermiso('abm') ? '' : 'none';
    $('#bC').style.display = tienePermiso('importar') ? '' : 'none';
    $('#bD').style.display = tienePermiso('reportes') ? '' : 'none';
    if (!r) {
      $('#contenido').innerHTML = '';
      $('#lgUsuario').value = ''; $('#lgClave').value = '';
      $('#lgUsuario').focus();
    }
  }
  /* Login de demostración: no se valida nada, cualquier usuario y contraseña (o vacíos) entran. */
  $('#loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    setRol($('#lgRol').value, $('#lgUsuario').value.trim());
  });
  $('#cambiarRol').addEventListener('click', function () { setRol(null); });
  window.Sesion = { rol: getRol, tienePermiso: tienePermiso };   /* para usar despues: Sesion.rol() / Sesion.tienePermiso(permiso) */
  pintarSesion();
  ruta();
})();
</script>
</body>
</html>
